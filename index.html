<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Laporan Afiliasi TikTok — Golden Tin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#14181F;
  --paper:#FFFFFF;
  --page:#EEF0F2;
  --rule:#D6DAE0;
  --muted:#5D6672;
  --brass:#9A6A00;
  --brass-soft:rgba(154,106,0,.10);
  --pos:#1B6B3A;
  --neg:#9A3412;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{
  background:var(--page);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  font-variant-numeric:tabular-nums;
}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---- Kepala laporan ---- */
.masthead{
  background:var(--paper);border-bottom:1px solid var(--rule);
  padding:16px 24px;position:sticky;top:0;z-index:40;
}
.masthead-inner{max-width:1180px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:12px;letter-spacing:.02em;color:var(--brass);margin-bottom:2px}
.masthead h1{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em}
.masthead-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:7px}
.field label{font-size:12px;color:var(--muted)}
select,.btn,.btn-quiet{font-family:inherit;font-size:13px}
select{
  background:var(--paper);color:var(--ink);border:1px solid var(--rule);
  border-radius:4px;padding:7px 10px;cursor:pointer;max-width:230px;
}
.btn{background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:4px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:#000}
.btn-quiet{background:none;border:1px solid var(--rule);border-radius:4px;padding:7px 12px;cursor:pointer;color:var(--muted)}
.btn-quiet:hover{color:var(--ink);border-color:var(--muted)}
.stamp{font-size:12px;color:var(--muted);width:100%;text-align:right}

main{max-width:1180px;margin:0 auto;padding:24px}
.lede{font-size:13px;color:var(--muted);margin-bottom:20px;max-width:66ch}

/* ---- Ringkasan ---- */
.summary{
  background:var(--paper);border:1px solid var(--rule);
  display:grid;grid-template-columns:minmax(240px,1fr) minmax(0,2fr);
}
.summary-focal{padding:24px;border-right:1px solid var(--rule)}
.focal-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.focal-value{font-family:var(--serif);font-size:40px;line-height:1.05;font-weight:600;color:var(--brass);letter-spacing:-.02em}
.focal-note{font-size:12px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.focal-note b{font-weight:600;color:var(--ink)}
.summary-list{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{padding:16px 20px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule)}
.stat:nth-child(3n){border-right:none}
.stat:nth-last-child(-n+3){border-bottom:none}
.stat dt{font-size:12px;color:var(--muted);margin-bottom:4px}
.stat dd{font-size:20px;font-weight:600}
.stat .hint{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}

/* ---- Panel ---- */
h2.sec{font-family:var(--serif);font-size:16px;font-weight:600;margin:30px 0 12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.panel{background:var(--paper);border:1px solid var(--rule);padding:18px 20px;min-width:0}
.panel h3{font-size:13px;font-weight:600;margin-bottom:2px}
.panel .q{font-size:12px;color:var(--muted);margin-bottom:14px}
.chart-wrap{position:relative;height:230px}
.legend{display:flex;gap:14px;margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.swatch{width:10px;height:10px;flex-shrink:0}

/* ---- Leaderboard ---- */
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{background:none;border:1px solid var(--rule);border-radius:4px;padding:5px 12px;font-size:12px;font-family:inherit;color:var(--muted);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.lb{list-style:none}
.lb li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.lb li:last-child{border-bottom:none}
.rank{font-size:12px;color:var(--muted);width:20px;flex-shrink:0}
.namebtn{flex:1;min-width:0;background:none;border:none;padding:0;font:inherit;font-size:13px;color:var(--ink);text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.namebtn:hover{color:var(--brass);text-decoration-color:var(--brass)}
.bar{width:64px;height:6px;background:var(--page);flex-shrink:0}
.bar i{display:block;height:6px;background:var(--brass)}
.lbval{font-size:13px;font-weight:600;min-width:74px;text-align:right}

/* ---- Tabel ---- */
.scroll{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--page)}
.num{text-align:right}
.badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:12px;font-weight:600;border:1px solid}
.b-pos{color:var(--pos);border-color:rgba(27,107,58,.35);background:rgba(27,107,58,.07)}
.b-mid{color:var(--brass);border-color:rgba(154,106,0,.35);background:var(--brass-soft)}
.b-neg{color:var(--neg);border-color:rgba(154,52,18,.35);background:rgba(154,52,18,.07)}
.linkout{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.linkout:hover{color:var(--brass);text-decoration-color:var(--brass)}

/* ---- Keadaan ---- */
.state{background:var(--paper);border:1px solid var(--rule);padding:40px 24px;text-align:center}
.state h2{font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:8px}
.state p{font-size:13px;color:var(--muted);max-width:52ch;margin:0 auto 6px;line-height:1.6}
.state .actions{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.state code{background:var(--page);padding:1px 5px;border-radius:3px;font-size:12px}
.spin{width:26px;height:26px;border:2px solid var(--rule);border-top-color:var(--brass);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.panel-state{color:var(--muted);font-size:13px;padding:28px 0;text-align:center}

/* ---- Drawer ---- */
.overlay{position:fixed;inset:0;background:rgba(20,24,31,.45);z-index:90;display:none}
.overlay[data-open="true"]{display:block}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:min(540px,100%);
  background:var(--paper);border-left:1px solid var(--rule);
  box-shadow:-8px 0 24px rgba(20,24,31,.12);
  z-index:100;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .22s ease;visibility:hidden;
}
.drawer[data-open="true"]{transform:translateX(0);visibility:visible}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer-head h2{font-family:var(--serif);font-size:17px;font-weight:600}
.drawer-head p{font-size:12px;color:var(--muted);margin-top:2px}
.drawer-body{padding:20px;overflow-y:auto;flex:1}
.closebtn{background:none;border:1px solid var(--rule);border-radius:4px;width:30px;height:30px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;flex-shrink:0;font-family:inherit}
.closebtn:hover{color:var(--ink);border-color:var(--muted)}
.dstats{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);margin-bottom:20px}
.dstat{padding:12px 14px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule)}
.dstat:nth-child(2n){border-right:none}
.dstat:nth-last-child(-n+2){border-bottom:none}
.dstat dt{font-size:12px;color:var(--muted)}
.dstat dd{font-size:17px;font-weight:600;margin-top:2px}
.drawer-body h3{font-size:13px;font-weight:600;margin-bottom:10px}

/* ---- Setup ---- */
.setup{max-width:540px;margin:48px auto;background:var(--paper);border:1px solid var(--rule);padding:26px}
.setup h2{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:8px}
.setup p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.setup input{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:10px 12px;font-size:13px;font-family:inherit;margin-bottom:12px}
.err{color:var(--neg);font-size:13px;margin-bottom:10px}

@media (max-width:860px){
  .summary{grid-template-columns:minmax(0,1fr)}
  .summary-focal{border-right:none;border-bottom:1px solid var(--rule)}
  .summary-list{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(3n){border-right:1px solid var(--rule)}
  .stat:nth-child(2n){border-right:none}
  .stat:nth-last-child(-n+3){border-bottom:1px solid var(--rule)}
  .stat:nth-last-child(-n+2){border-bottom:none}
  .row{grid-template-columns:minmax(0,1fr)}
  main{padding:18px 14px}
  .masthead{padding:14px}
  .stamp{text-align:left}
  .focal-value{font-size:34px}
}
@media (prefers-reduced-motion:reduce){
  .drawer{transition:none}
  .spin{animation-duration:2s}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div>
      <div class="brand">Golden Tin</div>
      <h1>Laporan Afiliasi TikTok</h1>
    </div>
    <div class="masthead-controls" id="controls" hidden>
      <div class="field">
        <label for="periode">Periode</label>
        <select id="periode"></select>
      </div>
      <button class="btn" id="btn-refresh" type="button">Perbarui</button>
      <button class="btn-quiet" id="btn-api" type="button">Ubah URL API</button>
    </div>
    <div class="stamp" id="stamp"></div>
  </div>
</header>

<main id="main">
  <div class="state">
    <div class="spin"></div>
    <h2>Mengambil data</h2>
    <p>Membaca cache dashboard dari Google Sheets.</p>
  </div>
</main>

<div class="overlay" id="overlay" data-open="false"></div>
<aside class="drawer" id="drawer" data-open="false" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
  <div class="drawer-head">
    <div>
      <h2 id="drawer-title">Detail kreator</h2>
      <p id="drawer-sub"></p>
    </div>
    <button class="closebtn" id="drawer-close" type="button" aria-label="Tutup detail kreator">&times;</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script>
'use strict';

var LS_KEY  = 'kol_api_url';
var GAS_URL = localStorage.getItem(LS_KEY) || '';

var data        = { months: [], byMonth: {}, monthMeta: {} };
var activeBulan = null;
var lbMode      = 'gmv';
var chartGMV    = null;
var chartVT     = null;
var lastFocus   = null;

var BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

/* ---------- format ---------- */
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function id2(n){ return n.toLocaleString('id-ID',{maximumFractionDigits:2}); }
function rupiah(n){
  n = Number(n) || 0;
  if (n >= 1e9) return 'Rp ' + id2(n/1e9) + ' M';
  if (n >= 1e6) return 'Rp ' + id2(n/1e6) + ' jt';
  if (n >= 1e3) return 'Rp ' + Math.round(n/1e3).toLocaleString('id-ID') + ' rb';
  return 'Rp ' + Math.round(n).toLocaleString('id-ID');
}
function angka(n){ return Math.round(Number(n)||0).toLocaleString('id-ID'); }
function roi(n){ return id2(Number(n)||0) + 'x'; }
function persen(n){ return id2((Number(n)||0)*100) + '%'; }
function tanggal(s){
  if (!s) return '';
  var p = String(s).split('-');
  if (p.length < 3) return s;
  return parseInt(p[2],10) + ' ' + BULAN[parseInt(p[1],10)-1] + ' ' + p[0];
}
function tanggalPendek(s){
  var p = String(s).split('-');
  if (p.length < 3) return s;
  return parseInt(p[2],10) + ' ' + BULAN[parseInt(p[1],10)-1];
}
function labelPeriode(b){
  var m = (data.monthMeta || {})[b];
  if (m && m.date_start && m.date_end) return tanggal(m.date_start) + ' sampai ' + tanggal(m.date_end);
  var p = String(b).split('-');
  return BULAN[parseInt(p[1],10)-1] + ' ' + p[0];
}
function kelasRoi(v){ return v >= 3 ? 'b-pos' : (v >= 1 ? 'b-mid' : 'b-neg'); }

/* ---------- muat data ---------- */
function setStamp(t){ document.getElementById('stamp').textContent = t; }

function stateHtml(judul, teks, tombol){
  return '<div class="state"><h2>' + judul + '</h2><p>' + teks + '</p>' +
         (tombol ? '<div class="actions">' + tombol + '</div>' : '') + '</div>';
}

function muat(){
  if (!GAS_URL) { tampilSetup(); return; }

  document.getElementById('controls').hidden = true;
  setStamp('Memuat');
  document.getElementById('main').innerHTML =
    '<div class="state"><div class="spin"></div><h2>Mengambil data</h2>' +
    '<p>Membaca cache dashboard dari Google Sheets.</p></div>';

  fetch(GAS_URL)
    .then(function(r){
      if (!r.ok) throw new Error('Server menjawab ' + r.status);
      return r.json();
    })
    .then(function(json){
      if (!json.ok) throw new Error(json.error || 'Respons tidak dikenali');
      data = json.data || { months: [], byMonth: {}, monthMeta: {} };
      if (!data.monthMeta) data.monthMeta = {};
      Object.keys(data.byMonth || {}).forEach(function(m){
        var d = data.byMonth[m];
        data.monthMeta[m] = { date_start: d.date_start, date_end: d.date_end };
      });

      setStamp('Diperbarui ' + new Date().toLocaleString('id-ID'));

      if (!data.months || !data.months.length) {
        document.getElementById('main').innerHTML = stateHtml(
          'Belum ada periode yang terbaca',
          'Cache dashboard masih kosong. Buka Google Sheets, jalankan menu KOL Dashboard, lalu Impor report TikTok. Setelah impor selesai, jalankan Perbarui cache dashboard.',
          '<button class="btn" type="button" onclick="muat()">Muat ulang</button>'
        );
        return;
      }

      if (!activeBulan || !data.byMonth[activeBulan]) activeBulan = data.months[data.months.length-1];
      try {
        document.getElementById('controls').hidden = false;
        rangkaShell();
        render();
      } catch (err) {
        document.getElementById('controls').hidden = true;
        document.getElementById('main').innerHTML = stateHtml(
          'Laporan gagal ditampilkan',
          'Data periode terbaca, tapi tampilan gagal dirakit. Penyebab: ' + esc(err.message) + '.',
          '<button class="btn" type="button" onclick="muat()">Muat ulang</button>'
        );
      }
    })
    .catch(function(e){
      setStamp('Gagal memuat');
      document.getElementById('controls').hidden = true;
      document.getElementById('main').innerHTML = stateHtml(
        'Data tidak bisa diambil',
        'Penyebab: ' + esc(e.message) + '. Periksa URL Web App Apps Script, dan pastikan deployment disetel untuk diakses siapa saja yang punya tautan.',
        '<button class="btn" type="button" onclick="muat()">Coba lagi</button>' +
        '<button class="btn-quiet" type="button" onclick="tampilSetup()">Ubah URL API</button>'
      );
    });
}

/* ---------- setup URL ---------- */
function tampilSetup(pesan){
  document.getElementById('controls').hidden = true;
  setStamp('');
  document.getElementById('main').innerHTML =
    '<div class="setup">' +
      '<h2>Sambungkan ke Google Sheets</h2>' +
      '<p>Tempel URL Web App Apps Script. Ambil dari Apps Script, menu Deploy, Manage deployments, lalu salin URL yang berakhiran /exec.</p>' +
      (pesan ? '<div class="err">' + esc(pesan) + '</div>' : '') +
      '<input type="text" id="api-input" placeholder="https://script.google.com/macros/s/.../exec" value="' + esc(GAS_URL) + '"/>' +
      '<button class="btn" type="button" id="api-save">Simpan dan muat laporan</button>' +
    '</div>';
  document.getElementById('api-save').addEventListener('click', simpanUrl);
  document.getElementById('api-input').addEventListener('keydown', function(e){
    if (e.key === 'Enter') simpanUrl();
  });
  document.getElementById('api-input').focus();
}

function simpanUrl(){
  var v = document.getElementById('api-input').value.trim();
  if (!/^https:\/\/script\.google\.com\/.*\/exec/.test(v)) {
    tampilSetup('URL harus dari script.google.com dan berakhiran /exec.');
    return;
  }
  GAS_URL = v;
  localStorage.setItem(LS_KEY, v);
  muat();
}

/* ---------- kerangka ---------- */
function rangkaShell(){
  var sel = document.getElementById('periode');
  sel.innerHTML = data.months.map(function(m){
    return '<option value="' + esc(m) + '"' + (m === activeBulan ? ' selected' : '') + '>' + esc(labelPeriode(m)) + '</option>';
  }).join('');

  document.getElementById('main').innerHTML =
    '<p class="lede" id="lede"></p>' +

    '<section class="summary">' +
      '<div class="summary-focal">' +
        '<div class="focal-label">GMV periode ini</div>' +
        '<div class="focal-value" id="focal-gmv">&mdash;</div>' +
        '<div class="focal-note" id="focal-note"></div>' +
      '</div>' +
      '<dl class="summary-list" id="ringkasan"></dl>' +
    '</section>' +

    '<h2 class="sec">Jalannya periode</h2>' +
    '<div class="row">' +
      '<div class="panel">' +
        '<h3>GMV per tanggal posting</h3>' +
        '<p class="q" id="q-gmv"></p>' +
        '<div class="chart-wrap"><canvas id="cGMV"></canvas></div>' +
        '<div class="panel-state" id="s-gmv" hidden></div>' +
      '</div>' +
      '<div class="panel">' +
        '<h3>Video baru naik per hari</h3>' +
        '<p class="q" id="q-vt"></p>' +
        '<div class="legend">' +
          '<span><i class="swatch" style="background:#4A5565"></i>Akun internal</span>' +
          '<span><i class="swatch" style="background:#9A6A00"></i>Affiliator</span>' +
        '</div>' +
        '<div class="chart-wrap"><canvas id="cVT"></canvas></div>' +
        '<div class="panel-state" id="s-vt" hidden></div>' +
      '</div>' +
    '</div>' +

    '<h2 class="sec">Siapa yang menghasilkan</h2>' +
    '<div class="row">' +
      '<div class="panel">' +
        '<h3>Peringkat kreator</h3>' +
        '<p class="q">Klik nama untuk melihat semua videonya di periode ini.</p>' +
        '<div class="tabs">' +
          '<button class="tab" type="button" id="tab-gmv" aria-pressed="true">GMV tertinggi</button>' +
          '<button class="tab" type="button" id="tab-roi" aria-pressed="false">ROI tertinggi</button>' +
        '</div>' +
        '<div id="lb"></div>' +
      '</div>' +
      '<div class="panel">' +
        '<h3>Video dengan GMV tertinggi</h3>' +
        '<p class="q">Dua puluh video teratas di periode ini.</p>' +
        '<div id="topvideo"></div>' +
      '</div>' +
    '</div>';

  document.getElementById('tab-gmv').addEventListener('click', function(){ gantiTab('gmv'); });
  document.getElementById('tab-roi').addEventListener('click', function(){ gantiTab('roi'); });
}

/* ---------- render ---------- */
function render(){
  var d = data.byMonth[activeBulan];
  if (!d) return;

  document.getElementById('lede').textContent =
    'Periode ' + labelPeriode(activeBulan) + ', diambil dari rentang tanggal pada nama file report TikTok yang diimpor.';

  var k = d.kpi || {};
  document.getElementById('focal-gmv').textContent = rupiah(k.total_gmv);
  document.getElementById('focal-note').innerHTML =
    'Spend <b>' + esc(rupiah(k.total_spend)) + '</b>, jadi ROI <b>' + esc(roi(k.avg_roi)) + '</b>.';

  document.getElementById('ringkasan').innerHTML = [
    stat('Kreator', angka(k.total_creator), k.active_creator + ' punya aktivitas iklan'),
    stat('Konten', angka(k.total_video), k.active_video + ' punya aktivitas iklan'),
    stat('Spend', rupiah(k.total_spend), 'total biaya iklan'),
    stat('Order', angka(k.total_order), 'pesanan SKU'),
    stat('Kreator aktif', angka(k.active_creator), 'ada impresi, order, atau spend'),
    stat('Video baru', angka(k.vt_baru), 'posting di dalam rentang periode')
  ].join('');

  var rentang = tanggalPendek(d.date_start) + ' sampai ' + tanggalPendek(d.date_end);
  document.getElementById('q-gmv').textContent = 'Tanggal posting mana yang menghasilkan, ' + rentang + '.';
  document.getElementById('q-vt').textContent  = 'Berapa video naik tiap hari, ' + rentang + '.';

  chartGmv(d.trendGMV || []);
  chartVt(d.vtHarian || []);
  renderLb(lbMode, d);
  renderTop(d);
}

function stat(label, val, hint){
  return '<div class="stat"><dt>' + esc(label) + '</dt><dd>' + esc(val) +
         '<div class="hint">' + esc(hint) + '</div></dd></div>';
}

function gantiBulan(b){
  activeBulan = b;
  render();
}

/* ---------- chart ---------- */
var AXIS = { color:'#5D6672', font:{ size:11 } };
var GRID = { color:'#E3E6EA' };

function kosongkanChart(idCanvas, idState, pesan, kosong){
  var cv = document.getElementById(idCanvas);
  var st = document.getElementById(idState);
  cv.parentNode.hidden = kosong;
  st.hidden = !kosong;
  st.textContent = pesan;
}

function pustakaGrafikAda(){ return typeof Chart !== 'undefined'; }

function chartGmv(trend){
  if (!pustakaGrafikAda()) {
    kosongkanChart('cGMV','s-gmv','Pustaka grafik tidak termuat. Periksa koneksi internet lalu tekan Perbarui. Angka di tabel tetap akurat.', true);
    return;
  }
  var ada = trend.some(function(t){ return t.gmv > 0; });
  kosongkanChart('cGMV','s-gmv','Tidak ada video dengan GMV yang tanggal postingnya jatuh di rentang periode ini.', !ada);
  if (chartGMV) { chartGMV.destroy(); chartGMV = null; }
  if (!ada) return;

  chartGMV = new Chart(document.getElementById('cGMV').getContext('2d'), {
    type:'line',
    data:{
      labels: trend.map(function(t){ return tanggalPendek(t.date); }),
      datasets:[{
        label:'GMV',
        data: trend.map(function(t){ return t.gmv; }),
        borderColor:'#9A6A00',
        backgroundColor:'rgba(154,106,0,.08)',
        borderWidth:2, pointRadius:2, pointHoverRadius:4, fill:true, tension:.25
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{
        legend:{ display:false },
        tooltip:{ callbacks:{ label:function(c){ return rupiah(c.parsed.y); } } }
      },
      scales:{
        x:{ ticks:Object.assign({ maxTicksLimit:12 }, AXIS), grid:GRID },
        y:{ ticks:Object.assign({ callback:function(v){ return rupiah(v); } }, AXIS), grid:GRID, beginAtZero:true }
      }
    }
  });
}

function chartVt(harian){
  if (!pustakaGrafikAda()) {
    kosongkanChart('cVT','s-vt','Pustaka grafik tidak termuat. Periksa koneksi internet lalu tekan Perbarui. Angka di tabel tetap akurat.', true);
    return;
  }
  var ada = harian.some(function(h){ return (h.internal + h.affiliator) > 0; });
  kosongkanChart('cVT','s-vt','Tidak ada video yang diposting di dalam rentang periode ini.', !ada);
  if (chartVT) { chartVT.destroy(); chartVT = null; }
  if (!ada) return;

  chartVT = new Chart(document.getElementById('cVT').getContext('2d'), {
    type:'bar',
    data:{
      labels: harian.map(function(h){ return tanggalPendek(h.date); }),
      datasets:[
        { label:'Akun internal', data:harian.map(function(h){ return h.internal; }),   backgroundColor:'#4A5565' },
        { label:'Affiliator',    data:harian.map(function(h){ return h.affiliator; }), backgroundColor:'#9A6A00' }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      plugins:{ legend:{ display:false } },
      scales:{
        x:{ stacked:true, ticks:Object.assign({ maxTicksLimit:12 }, AXIS), grid:GRID },
        y:{ stacked:true, ticks:Object.assign({ precision:0 }, AXIS), grid:GRID, beginAtZero:true }
      }
    }
  });
}

/* ---------- leaderboard ---------- */
function gantiTab(mode){
  lbMode = mode;
  document.getElementById('tab-gmv').setAttribute('aria-pressed', mode === 'gmv');
  document.getElementById('tab-roi').setAttribute('aria-pressed', mode === 'roi');
  renderLb(mode, data.byMonth[activeBulan]);
}

function renderLb(mode, d){
  var list = mode === 'gmv' ? (d.leaderGMV || []) : (d.leaderROI || []);
  var box  = document.getElementById('lb');
  if (!list.length) {
    box.innerHTML = '<div class="panel-state">Belum ada kreator dengan aktivitas iklan di periode ini.</div>';
    return;
  }
  var max = mode === 'gmv' ? list[0].gmv : list[0].roi;
  box.innerHTML = '<ol class="lb">' + list.map(function(c, i){
    var raw = mode === 'gmv' ? c.gmv : c.roi;
    var val = mode === 'gmv' ? rupiah(c.gmv) : roi(c.roi);
    var w   = max > 0 ? (raw / max * 100) : 0;
    return '<li>' +
      '<span class="rank">' + (i+1) + '</span>' +
      '<button class="namebtn" type="button" data-user="' + esc(c.username) + '">' + esc(c.username) + '</button>' +
      '<span class="bar"><i style="width:' + w.toFixed(1) + '%"></i></span>' +
      '<span class="lbval">' + esc(val) + '</span>' +
    '</li>';
  }).join('') + '</ol>';
  pasangKlikNama(box);
}

/* ---------- top video ---------- */
function renderTop(d){
  var vids = d.topVideos || [];
  var box  = document.getElementById('topvideo');
  if (!vids.length) {
    box.innerHTML = '<div class="panel-state">Belum ada video dengan aktivitas iklan di periode ini.</div>';
    return;
  }
  var rows = vids.map(function(v, i){
    var url = 'https://www.tiktok.com/@' + encodeURIComponent(v.username) + '/video/' + encodeURIComponent(v.video_id);
    return '<tr>' +
      '<td>' + (i+1) + '</td>' +
      '<td><button class="namebtn" type="button" data-user="' + esc(v.username) + '">' + esc(v.username) + '</button></td>' +
      '<td class="num">' + esc(rupiah(v.gmv)) + '</td>' +
      '<td class="num">' + esc(angka(v.order)) + '</td>' +
      '<td class="num"><span class="badge ' + kelasRoi(v.roi) + '">' + esc(roi(v.roi)) + '</span></td>' +
      '<td class="num">' + esc(persen(v.ctr)) + '</td>' +
      '<td><a class="linkout" href="' + url + '" target="_blank" rel="noopener">Buka</a></td>' +
    '</tr>';
  }).join('');

  box.innerHTML = '<div class="scroll"><table>' +
    '<thead><tr><th>#</th><th>Kreator</th><th class="num">GMV</th><th class="num">Order</th>' +
    '<th class="num">ROI</th><th class="num">CTR</th><th>Tautan</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>';
  pasangKlikNama(box);
}

function pasangKlikNama(root){
  root.querySelectorAll('.namebtn').forEach(function(b){
    b.addEventListener('click', function(){ bukaKreator(b.getAttribute('data-user'), b); });
  });
}

/* ---------- drawer ---------- */
function bukaKreator(username, trigger){
  lastFocus = trigger || document.activeElement;
  var drawer = document.getElementById('drawer');
  document.getElementById('drawer-title').textContent = '@' + username;
  document.getElementById('drawer-sub').textContent   = labelPeriode(activeBulan);
  document.getElementById('drawer-body').innerHTML    =
    '<div class="panel-state"><div class="spin"></div>Mengambil video kreator ini.</div>';

  drawer.setAttribute('data-open','true');
  drawer.setAttribute('aria-hidden','false');
  document.getElementById('overlay').setAttribute('data-open','true');
  document.getElementById('drawer-close').focus();

  var url = GAS_URL + '?action=creator&username=' + encodeURIComponent(username) +
            '&bulan=' + encodeURIComponent(activeBulan);

  fetch(url)
    .then(function(r){
      if (!r.ok) throw new Error('Server menjawab ' + r.status);
      return r.json();
    })
    .then(function(json){
      if (!json.ok) throw new Error(json.error || 'Respons tidak dikenali');
      renderDrawer(json.data || []);
    })
    .catch(function(e){
      document.getElementById('drawer-body').innerHTML =
        '<div class="panel-state">Detail gagal diambil. Penyebab: ' + esc(e.message) + '. Tutup panel ini lalu coba lagi.</div>';
    });
}

function renderDrawer(videos){
  if (!videos.length) {
    document.getElementById('drawer-body').innerHTML =
      '<div class="panel-state">Kreator ini tidak punya video pada periode yang dipilih. Coba pilih periode lain di bagian atas laporan.</div>';
    return;
  }
  var sum = function(f){ return videos.reduce(function(s,v){ return s + (Number(v[f])||0); }, 0); };
  var gmv = sum('gmv'), biaya = sum('biaya'), order = sum('order'),
      klik = sum('click'), impr = sum('impression');

  var rows = videos.map(function(v, i){
    var url = 'https://www.tiktok.com/@' + encodeURIComponent(v.username) + '/video/' + encodeURIComponent(v.video_id);
    return '<tr>' +
      '<td>' + (i+1) + '</td>' +
      '<td>' + esc(tanggalPendek(v.tgl_posting)) + '</td>' +
      '<td class="num">' + esc(rupiah(v.gmv)) + '</td>' +
      '<td class="num">' + esc(angka(v.order)) + '</td>' +
      '<td class="num"><span class="badge ' + kelasRoi(v.roi) + '">' + esc(roi(v.roi)) + '</span></td>' +
      '<td class="num">' + esc(persen(v.ctr)) + '</td>' +
      '<td class="num">' + esc(persen(v.ctor)) + '</td>' +
      '<td><a class="linkout" href="' + url + '" target="_blank" rel="noopener">Buka</a></td>' +
    '</tr>';
  }).join('');

  document.getElementById('drawer-body').innerHTML =
    '<dl class="dstats">' +
      dstat('Video', angka(videos.length)) +
      dstat('GMV', rupiah(gmv)) +
      dstat('Spend', rupiah(biaya)) +
      dstat('Order', angka(order)) +
      dstat('ROI', biaya > 0 ? roi(gmv/biaya) : 'Tanpa spend') +
      dstat('CTR', impr > 0 ? persen(klik/impr) : 'Tanpa impresi') +
    '</dl>' +
    '<h3>Semua video (' + videos.length + ')</h3>' +
    '<div class="scroll"><table>' +
      '<thead><tr><th>#</th><th>Posting</th><th class="num">GMV</th><th class="num">Order</th>' +
      '<th class="num">ROI</th><th class="num">CTR</th><th class="num">CTOR</th><th>Tautan</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table></div>';
}

function dstat(l, v){
  return '<div class="dstat"><dt>' + esc(l) + '</dt><dd>' + esc(v) + '</dd></div>';
}

function tutupDrawer(){
  var drawer = document.getElementById('drawer');
  if (drawer.getAttribute('data-open') !== 'true') return;
  drawer.setAttribute('data-open','false');
  drawer.setAttribute('aria-hidden','true');
  document.getElementById('overlay').setAttribute('data-open','false');
  if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
}

/* ---------- pasang ---------- */
document.getElementById('overlay').addEventListener('click', tutupDrawer);
document.getElementById('drawer-close').addEventListener('click', tutupDrawer);
document.getElementById('btn-refresh').addEventListener('click', muat);
document.getElementById('btn-api').addEventListener('click', function(){ tampilSetup(); });
document.getElementById('periode').addEventListener('change', function(e){ gantiBulan(e.target.value); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') tutupDrawer(); });

muat();
</script>
