<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Laporan Afiliasi TikTok — Golden Tin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --ink:#14181F;--paper:#FFFFFF;--page:#EEF0F2;--rule:#D6DAE0;--muted:#5D6672;
  --brass:#9A6A00;--brass-soft:rgba(154,106,0,.10);
  --seller:#4A5565;--affil:#9A6A00;
  --pos:#1B6B3A;--neg:#9A3412;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.masthead{background:var(--paper);border-bottom:1px solid var(--rule);padding:16px 24px;position:sticky;top:0;z-index:40}
.masthead-inner{max-width:1180px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:12px;letter-spacing:.02em;color:var(--brass);margin-bottom:2px}
.masthead h1{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.01em}
.masthead-controls{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;color:var(--muted)}
input[type=date]{background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:6px 9px;font-family:inherit;font-size:13px}
.btn{background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:4px;padding:7px 14px;cursor:pointer;font-weight:600;font-family:inherit;font-size:13px}
.btn:hover{background:#000}
.btn-quiet{background:none;border:1px solid var(--rule);border-radius:4px;padding:7px 12px;cursor:pointer;color:var(--muted);font-family:inherit;font-size:13px}
.btn-quiet:hover{color:var(--ink);border-color:var(--muted)}
.stamp{font-size:12px;color:var(--muted);width:100%;text-align:right}

main{max-width:1180px;margin:0 auto;padding:24px}
.lede{font-size:13px;color:var(--muted);margin-bottom:20px;max-width:72ch}

/* Ringkasan */
.summary{background:var(--paper);border:1px solid var(--rule);display:grid;grid-template-columns:minmax(250px,1fr) minmax(0,2fr)}
.summary-focal{padding:22px 24px;border-right:1px solid var(--rule)}
.focal-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.focal-value{font-family:var(--serif);font-size:40px;line-height:1.05;font-weight:600;color:var(--brass);letter-spacing:-.02em}
.focal-split{font-size:12px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:5px}
.focal-split .r{display:flex;justify-content:space-between;gap:10px}
.focal-split b{font-weight:600;color:var(--ink)}
.summary-list{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{padding:15px 18px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule)}
.stat:nth-child(3n){border-right:none}
.stat:nth-last-child(-n+3){border-bottom:none}
.stat dt{font-size:12px;color:var(--muted);margin-bottom:4px}
.stat dd{font-size:20px;font-weight:600}
.stat .split{font-size:11px;color:var(--muted);font-weight:400;margin-top:4px;line-height:1.5}
.stat .split i{font-style:normal}
.sw{display:inline-block;width:7px;height:7px;border-radius:1px;margin-right:4px;vertical-align:middle}
.sw-s{background:var(--seller)}.sw-a{background:var(--affil)}

h2.sec{font-family:var(--serif);font-size:16px;font-weight:600;margin:30px 0 12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.panel{background:var(--paper);border:1px solid var(--rule);padding:18px 20px;min-width:0}
.panel h3{font-size:13px;font-weight:600;margin-bottom:2px}
.panel .q{font-size:12px;color:var(--muted);margin-bottom:14px}
.chart-wrap{position:relative;height:230px}
.legend{display:flex;gap:14px;margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.swatch{width:10px;height:10px;flex-shrink:0}

.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:none;border:1px solid var(--rule);border-radius:4px;padding:5px 12px;font-size:12px;font-family:inherit;color:var(--muted);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}

.lb{list-style:none}
.lb li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.lb li:last-child{border-bottom:none}
.rank{font-size:12px;color:var(--muted);width:20px;flex-shrink:0}
.namebtn{flex:1;min-width:0;background:none;border:none;padding:0;font:inherit;font-size:13px;color:var(--ink);text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.namebtn:hover{color:var(--brass);text-decoration-color:var(--brass)}
.bar{width:64px;height:6px;background:var(--page);flex-shrink:0}
.bar i{display:block;height:6px;background:var(--brass)}
.lbval{font-size:13px;font-weight:600;min-width:74px;text-align:right}

.scroll{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--page)}
.num{text-align:right}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable[aria-sort]:not([aria-sort="none"]){color:var(--brass)}
th .arw{font-size:10px;margin-left:3px}
.badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:12px;font-weight:600;border:1px solid}
.b-pos{color:var(--pos);border-color:rgba(27,107,58,.35);background:rgba(27,107,58,.07)}
.b-mid{color:var(--brass);border-color:rgba(154,106,0,.35);background:var(--brass-soft)}
.b-neg{color:var(--neg);border-color:rgba(154,52,18,.35);background:rgba(154,52,18,.07)}
.linkout{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.linkout:hover{color:var(--brass);text-decoration-color:var(--brass)}

/* filter bar tabel per video */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.filter{border:1px solid var(--rule);border-radius:4px;padding:10px 12px}
.filter label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.filter .ctl{display:flex;gap:6px;align-items:center}
.filter select,.filter input{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;font-family:inherit;font-size:13px;min-width:0}
.filter select{flex-shrink:0}
.filter input{flex:1;width:100%}
.filter .two{display:flex;gap:6px}
.filter .two input{width:50%}
.filter-actions{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.count{font-size:12px;color:var(--muted)}
.pager{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:14px}
.pager button{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:5px 10px;font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;min-width:34px}
.pager button:hover:not(:disabled){border-color:var(--muted)}
.pager button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.pager button:disabled{color:var(--muted);cursor:default;opacity:.5}
.pager .gap{color:var(--muted);padding:0 2px}

.state{background:var(--paper);border:1px solid var(--rule);padding:40px 24px;text-align:center}
.state h2{font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:8px}
.state p{font-size:13px;color:var(--muted);max-width:56ch;margin:0 auto 6px;line-height:1.6}
.state .actions{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.spin{width:26px;height:26px;border:2px solid var(--rule);border-top-color:var(--brass);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.panel-state{color:var(--muted);font-size:13px;padding:28px 0;text-align:center}

.overlay{position:fixed;inset:0;background:rgba(20,24,31,.45);z-index:90;display:none}
.overlay[data-open="true"]{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,100%);background:var(--paper);border-left:1px solid var(--rule);box-shadow:-8px 0 24px rgba(20,24,31,.12);z-index:100;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;visibility:hidden}
.drawer[data-open="true"]{transform:translateX(0);visibility:visible}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.drawer-head h2{font-family:var(--serif);font-size:17px;font-weight:600}
.drawer-head p{font-size:12px;color:var(--muted);margin-top:2px}
.drawer-body{padding:20px;overflow-y:auto;flex:1}
.closebtn{background:none;border:1px solid var(--rule);border-radius:4px;width:30px;height:30px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;flex-shrink:0;font-family:inherit}
.closebtn:hover{color:var(--ink);border-color:var(--muted)}
.dstats{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);margin-bottom:20px}
.dstat{padding:12px 14px;border-bottom:1px solid var(--rule);border-right:1px solid var(--rule)}
.dstat:nth-child(2n){border-right:none}
.dstat:nth-last-child(-n+2){border-bottom:none}
.dstat dt{font-size:12px;color:var(--muted)}
.dstat dd{font-size:17px;font-weight:600;margin-top:2px}
.drawer-body h3{font-size:13px;font-weight:600;margin-bottom:10px}

.setup{max-width:540px;margin:48px auto;background:var(--paper);border:1px solid var(--rule);padding:26px}
.setup h2{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:8px}
.setup p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.setup input{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:10px 12px;font-size:13px;font-family:inherit;margin-bottom:12px}
.err{color:var(--neg);font-size:13px;margin-bottom:10px}

@media (max-width:860px){
  .summary{grid-template-columns:minmax(0,1fr)}
  .summary-focal{border-right:none;border-bottom:1px solid var(--rule)}
  .summary-list{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(3n){border-right:1px solid var(--rule)}
  .stat:nth-child(2n){border-right:none}
  .stat:nth-last-child(-n+3){border-bottom:1px solid var(--rule)}
  .stat:nth-last-child(-n+2){border-bottom:none}
  .row{grid-template-columns:minmax(0,1fr)}
  main{padding:18px 14px}
  .masthead{padding:14px}
  .stamp{text-align:left}
  .focal-value{font-size:34px}
}
@media (prefers-reduced-motion:reduce){ .drawer{transition:none} .spin{animation-duration:2s} }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div>
      <div class="brand">Golden Tin</div>
      <h1>Laporan Afiliasi TikTok</h1>
    </div>
    <div class="masthead-controls" id="controls" hidden>
      <div class="field"><label for="d-start">Dari tanggal</label><input type="date" id="d-start"></div>
      <div class="field"><label for="d-end">Sampai tanggal</label><input type="date" id="d-end"></div>
      <button class="btn" id="btn-apply" type="button">Terapkan</button>
      <button class="btn-quiet" id="btn-api" type="button">Ubah URL API</button>
    </div>
    <div class="stamp" id="stamp"></div>
  </div>
</header>

<main id="main">
  <div class="state"><div class="spin"></div><h2>Mengambil data</h2><p>Menyiapkan rentang tanggal.</p></div>
</main>

<div class="overlay" id="overlay" data-open="false"></div>
<aside class="drawer" id="drawer" data-open="false" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
  <div class="drawer-head">
    <div><h2 id="drawer-title">Detail kreator</h2><p id="drawer-sub"></p></div>
    <button class="closebtn" id="drawer-close" type="button" aria-label="Tutup detail">&times;</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script>
'use strict';

var LS_KEY='kol_api_url';
var GAS_URL=localStorage.getItem(LS_KEY)||'';
var boot={min:null,max:null};
var rep=null;
var lbMode='gmv';
var chartGMV=null, chartVT=null;
var lastFocus=null;
var allVideos=[];         // untuk tabel performa per video
var topSort={key:'gmv',dir:'desc'};
var BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

/* format */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function id2(n){return (Number(n)||0).toLocaleString('id-ID',{maximumFractionDigits:2});}
function rupiah(n){n=Number(n)||0;if(n>=1e9)return'Rp '+id2(n/1e9)+' M';if(n>=1e6)return'Rp '+id2(n/1e6)+' jt';if(n>=1e3)return'Rp '+Math.round(n/1e3).toLocaleString('id-ID')+' rb';return'Rp '+Math.round(n).toLocaleString('id-ID');}
function angka(n){return Math.round(Number(n)||0).toLocaleString('id-ID');}
function roi(n){return id2(n)+'x';}
function persen(n){return id2((Number(n)||0)*100)+'%';}
function rasio(n){return id1((Number(n)||0)*100)+'%';}
function id1(n){return (Number(n)||0).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1});}
function tanggal(s){if(!s)return'';var p=String(s).split('-');if(p.length<3)return s;return parseInt(p[2],10)+' '+BULAN[parseInt(p[1],10)-1]+' '+p[0];}
function tglPendek(s){var p=String(s).split('-');if(p.length<3)return s;return parseInt(p[2],10)+' '+BULAN[parseInt(p[1],10)-1];}
function kelasRoi(v){return v>=3?'b-pos':(v>=1?'b-mid':'b-neg');}

function setStamp(t){document.getElementById('stamp').textContent=t;}
function stateHtml(j,t,b){return '<div class="state"><h2>'+j+'</h2><p>'+t+'</p>'+(b?'<div class="actions">'+b+'</div>':'')+'</div>';}

/* ---------- alur ---------- */
function init(){
  if(!GAS_URL){tampilSetup();return;}
  muatReport();
}

function ambilBootstrap(){ muatReport(); }

function gagal(e){
  setStamp('Gagal memuat');
  document.getElementById('controls').hidden=true;
  document.getElementById('main').innerHTML=stateHtml('Data tidak bisa diambil',
    'Penyebab: '+esc(e.message)+'. Periksa URL Web App Apps Script, dan pastikan deployment dapat diakses siapa saja yang punya tautan.',
    '<button class="btn" type="button" onclick="ambilBootstrap()">Coba lagi</button>'+
    '<button class="btn-quiet" type="button" onclick="tampilSetup()">Ubah URL API</button>');
}

function rentang(){return {s:document.getElementById('d-start').value, e:document.getElementById('d-end').value};}

function muatReport(){
  var r=rentang();
  if(r.s && r.e && r.s>r.e){ document.getElementById('d-end').value=r.s; r.e=r.s; }
  setStamp('Memuat');
  document.getElementById('main').innerHTML='<div class="state"><div class="spin"></div><h2>Menghitung</h2><p>Menyusun laporan untuk rentang yang dipilih.</p></div>';
  var qs='';
  if(r.s) qs+='&start='+encodeURIComponent(r.s);
  if(r.e) qs+='&end='+encodeURIComponent(r.e);
  var url=GAS_URL+'?action=report'+qs;
  fetch(url).then(function(x){if(!x.ok)throw new Error('Server '+x.status);return x.json();})
    .then(function(j){
      if(!j.ok)throw new Error(j.error||'Respons tidak dikenali');
      rep=j.data;
      var b=rep.bounds||{};
      if(!b.min){
        document.getElementById('controls').hidden=true;
        document.getElementById('main').innerHTML=stateHtml('Belum ada data',
          'Belum ada file yang terbaca. Buka Google Sheets, jalankan menu KOL Dashboard, lalu Impor report TikTok (file Creatives per video dan product_list).',
          '<button class="btn" type="button" onclick="muatReport()">Muat ulang</button>');
        return;
      }
      document.getElementById('controls').hidden=false;
      var ds=document.getElementById('d-start'), de=document.getElementById('d-end');
      ds.min=de.min=b.min; ds.max=de.max=b.max;
      if(!ds.value) ds.value=rep.range.start;
      if(!de.value) de.value=rep.range.end;
      setStamp('Diperbarui '+new Date().toLocaleString('id-ID'));
      try{ rangkaShell(); render(); muatTabelVideo(); }
      catch(err){ document.getElementById('main').innerHTML=stateHtml('Laporan gagal ditampilkan','Data terbaca, tapi tampilan gagal dirakit. Penyebab: '+esc(err.message)+'.','<button class="btn" type="button" onclick="muatReport()">Muat ulang</button>'); }
    })
    .catch(function(e){ gagal(e); });
}

/* ---------- setup URL ---------- */
function tampilSetup(pesan){
  document.getElementById('controls').hidden=true; setStamp('');
  document.getElementById('main').innerHTML=
    '<div class="setup"><h2>Sambungkan ke Google Sheets</h2>'+
    '<p>Tempel URL Web App Apps Script. Ambil dari Apps Script, menu Deploy, Manage deployments, salin URL berakhiran /exec.</p>'+
    (pesan?'<div class="err">'+esc(pesan)+'</div>':'')+
    '<input type="text" id="api-input" placeholder="https://script.google.com/macros/s/.../exec" value="'+esc(GAS_URL)+'"/>'+
    '<button class="btn" type="button" id="api-save">Simpan dan muat laporan</button></div>';
  document.getElementById('api-save').addEventListener('click',simpanUrl);
  document.getElementById('api-input').addEventListener('keydown',function(e){if(e.key==='Enter')simpanUrl();});
  document.getElementById('api-input').focus();
}
function simpanUrl(){
  var v=document.getElementById('api-input').value.trim();
  if(!/^https:\/\/script\.google\.com\/.*\/exec/.test(v)){tampilSetup('URL harus dari script.google.com dan berakhiran /exec.');return;}
  GAS_URL=v; localStorage.setItem(LS_KEY,v); ambilBootstrap();
}

/* ---------- kerangka ---------- */
function rangkaShell(){
  document.getElementById('main').innerHTML=
    '<p class="lede" id="lede"></p>'+

    '<section class="summary">'+
      '<div class="summary-focal">'+
        '<div class="focal-label">Rasio biaya (spend ÷ GMV)</div>'+
        '<div class="focal-value" id="focal-ratio">&mdash;</div>'+
        '<div class="focal-split" id="focal-split"></div>'+
      '</div>'+
      '<dl class="summary-list" id="ringkasan"></dl>'+
    '</section>'+

    '<h2 class="sec">Jalannya periode</h2>'+
    '<div class="row">'+
      '<div class="panel"><h3>GMV per tanggal file</h3><p class="q" id="q-gmv"></p>'+
        '<div class="chart-wrap"><canvas id="cGMV"></canvas></div><div class="panel-state" id="s-gmv" hidden></div></div>'+
      '<div class="panel"><h3>Video baru naik per hari</h3><p class="q" id="q-vt"></p>'+
        '<div class="legend"><span><i class="swatch" style="background:var(--seller)"></i>Seller</span>'+
        '<span><i class="swatch" style="background:var(--affil)"></i>Affiliator</span></div>'+
        '<div class="chart-wrap"><canvas id="cVT"></canvas></div><div class="panel-state" id="s-vt" hidden></div></div>'+
    '</div>'+

    '<h2 class="sec">Siapa yang menghasilkan</h2>'+
    '<div class="row">'+
      '<div class="panel"><h3>Peringkat kreator</h3><p class="q">Klik nama untuk lihat semua videonya di rentang ini.</p>'+
        '<div class="tabs"><button class="tab" type="button" id="tab-gmv" aria-pressed="true">GMV tertinggi</button>'+
        '<button class="tab" type="button" id="tab-roi" aria-pressed="false">ROI tertinggi</button></div><div id="lb"></div></div>'+
      '<div class="panel"><h3>Top video</h3><p class="q">Sepuluh besar. Klik judul kolom untuk urutkan.</p><div id="topvideo"></div></div>'+
    '</div>'+

    '<h2 class="sec">Performa per video</h2>'+
    '<div class="panel">'+
      '<div class="filters" id="filters"></div>'+
      '<div class="filter-actions">'+
        '<button class="btn" type="button" id="btn-filter">Terapkan filter</button>'+
        '<button class="btn-quiet" type="button" id="btn-reset-filter">Reset</button>'+
        '<span class="count" id="filter-count"></span>'+
      '</div>'+
      '<div id="videotable"></div>'+
    '</div>';

  document.getElementById('tab-gmv').addEventListener('click',function(){gantiTab('gmv');});
  document.getElementById('tab-roi').addEventListener('click',function(){gantiTab('roi');});
  document.getElementById('filters').innerHTML=filtersHtml();

}

  document.getElementById('focal-ratio').textContent=rasio(k.rasio_biaya);
  document.getElementById('focal-split').innerHTML=

function stat(l,v,split){return '<div class="stat"><dt>'+esc(l)+'</dt><dd>'+esc(v)+'<div class="split">'+split+'</div></dd></div>';}
function splitRp(s,a){return 'Seller '+esc(rupiah(s))+' &middot; Affiliator '+esc(rupiah(a));}
function splitNum(s,a){return 'Seller '+esc(angka(s))+' &middot; Affiliator '+esc(angka(a));}

var AXIS={color:'#5D6672',font:{size:11}}, GRID={color:'#E3E6EA'};
function pustakaAda(){return typeof Chart!=='undefined';}
function kosongkanChart(cv,st,pesan,kosong){var c=document.getElementById(cv),s=document.getElementById(st);c.parentNode.hidden=kosong;s.hidden=!kosong;s.textContent=pesan;}

function chartGmv(trend){
  if(!pustakaAda()){kosongkanChart('cGMV','s-gmv','Pustaka grafik tidak termuat. Angka di kartu dan tabel tetap akurat.',true);return;}
  var ada=trend.some(function(t){return t.gmv>0;});
  kosongkanChart('cGMV','s-gmv','Belum ada GMV (file product_list) pada rentang ini.',!ada);
  if(chartGMV){chartGMV.destroy();chartGMV=null;} if(!ada)return;
  chartGMV=new Chart(document.getElementById('cGMV').getContext('2d'),{
    type:'line',
    data:{labels:trend.map(function(t){return tglPendek(t.date);}),
      datasets:[{data:trend.map(function(t){return t.gmv;}),borderColor:'#9A6A00',backgroundColor:'rgba(154,106,0,.08)',borderWidth:2,pointRadius:2,pointHoverRadius:4,fill:true,tension:.25}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return rupiah(c.parsed.y);}}}},
      scales:{x:{ticks:Object.assign({maxTicksLimit:12},AXIS),grid:GRID},y:{ticks:Object.assign({callback:function(v){return rupiah(v);}},AXIS),grid:GRID,beginAtZero:true}}}});
}
function chartVt(harian){
  if(!pustakaAda()){kosongkanChart('cVT','s-vt','Pustaka grafik tidak termuat. Angka di kartu dan tabel tetap akurat.',true);return;}
  var ada=harian.some(function(h){return (h.seller+h.affil)>0;});
  kosongkanChart('cVT','s-vt','Tidak ada video yang diposting di dalam rentang ini.',!ada);
  if(chartVT){chartVT.destroy();chartVT=null;} if(!ada)return;
  chartVT=new Chart(document.getElementById('cVT').getContext('2d'),{
    type:'bar',
    data:{labels:harian.map(function(h){return tglPendek(h.date);}),
      datasets:[{label:'Seller',data:harian.map(function(h){return h.seller;}),backgroundColor:'#4A5565'},
                {label:'Affiliator',data:harian.map(function(h){return h.affil;}),backgroundColor:'#9A6A00'}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}},
      scales:{x:{stacked:true,ticks:Object.assign({maxTicksLimit:12},AXIS),grid:GRID},y:{stacked:true,ticks:Object.assign({precision:0},AXIS),grid:GRID,beginAtZero:true}}}});
}

/* ---------- leaderboard ---------- */
function gantiTab(m){lbMode=m;document.getElementById('tab-gmv').setAttribute('aria-pressed',m==='gmv');document.getElementById('tab-roi').setAttribute('aria-pressed',m==='roi');renderLb(m);}
function renderLb(m){
  var list=m==='gmv'?(rep.leaderGMV||[]):(rep.leaderROI||[]);
  var box=document.getElementById('lb');
  if(!list.length){box.innerHTML='<div class="panel-state">Belum ada kreator dengan aktivitas iklan.</div>';return;}
  var max=m==='gmv'?list[0].gmv:list[0].roi;
  box.innerHTML='<ol class="lb">'+list.map(function(c,i){
    var raw=m==='gmv'?c.gmv:c.roi, val=m==='gmv'?rupiah(c.gmv):roi(c.roi), w=max>0?raw/max*100:0;
    return '<li><span class="rank">'+(i+1)+'</span><button class="namebtn" type="button" data-user="'+esc(c.username)+'">'+esc(c.username)+'</button>'+
      '<span class="bar"><i style="width:'+w.toFixed(1)+'%"></i></span><span class="lbval">'+esc(val)+'</span></li>';
  }).join('')+'</ol>';
  pasangKlikNama(box);
}

/* ---------- top video (sortable) ---------- */
function renderTop(){
  var vids=(rep.topVideos||[]).slice();
  var box=document.getElementById('topvideo');
  if(!vids.length){box.innerHTML='<div class="panel-state">Belum ada video dengan aktivitas iklan.</div>';return;}
  var key=topSort.key,dir=topSort.dir;
  vids.sort(function(a,b){var d=(b[key]||0)-(a[key]||0);return dir==='asc'?-d:d;});
  var cols=[['username','Kreator',false],['gmv','GMV',true],['order','Order',true],['roi','ROI',true],['ctr','CTR',true]];
  var head='<tr><th>#</th>'+cols.map(function(c){
    if(!c[2])return '<th>'+c[1]+'</th>';
    var arw=key===c[0]?(dir==='desc'?' ▼':' ▲'):'';
    return '<th class="sortable num" data-key="'+c[0]+'" aria-sort="'+(key===c[0]?(dir==='desc'?'descending':'ascending'):'none')+'">'+c[1]+'<span class="arw">'+arw+'</span></th>';
  }).join('')+'<th>Tautan</th></tr>';
  var rows=vids.map(function(v,i){
    var url='https://www.tiktok.com/@'+encodeURIComponent(v.username)+'/video/'+encodeURIComponent(v.video_id);
    return '<tr><td>'+(i+1)+'</td>'+
      '<td><button class="namebtn" type="button" data-user="'+esc(v.username)+'">'+esc(v.username)+'</button></td>'+
      '<td class="num">'+esc(rupiah(v.gmv))+'</td><td class="num">'+esc(angka(v.order))+'</td>'+
      '<td class="num"><span class="badge '+kelasRoi(v.roi)+'">'+esc(roi(v.roi))+'</span></td>'+
      '<td class="num">'+esc(persen(v.ctr))+'</td>'+
      '<td><a class="linkout" href="'+url+'" target="_blank" rel="noopener">Buka</a></td></tr>';
  }).join('');
  box.innerHTML='<div class="scroll"><table><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>';
  box.querySelectorAll('th.sortable').forEach(function(th){
    th.addEventListener('click',function(){var k=th.getAttribute('data-key');if(topSort.key===k)topSort.dir=topSort.dir==='desc'?'asc':'desc';else{topSort.key=k;topSort.dir='desc';}renderTop();});
  });
  pasangKlikNama(box);
}

/* ---------- tabel performa per video + filter ---------- */
function filtersHtml(){
  function num(id,label){return '<div class="filter"><label>'+label+'</label><div class="ctl"><select id="'+id+'-op">'+
    '<option value="">—</option><option value="gt">lebih besar</option><option value="lt">lebih kecil</option><option value="bt">antara</option></select>'+
    '<input type="number" id="'+id+'-a" placeholder="nilai" step="any"><input type="number" id="'+id+'-b" placeholder="s/d" step="any" hidden></div></div>';}
  function dt(id,label){return '<div class="filter"><label>'+label+'</label><div class="ctl"><select id="'+id+'-op">'+
    '<option value="">—</option><option value="gt">setelah</option><option value="lt">sebelum</option><option value="bt">antara</option></select>'+
    '<input type="date" id="'+id+'-a"><input type="date" id="'+id+'-b" hidden></div></div>';}
  return '<div class="filter"><label>Username</label><div class="ctl"><input type="text" id="f-user" placeholder="cari username"></div></div>'+
    num('f-roi','ROI')+num('f-spend','Spend')+num('f-gmv','GMV')+dt('f-post','Waktu posting');
}
function bindBetween(){
  ['f-roi','f-spend','f-gmv','f-post'].forEach(function(id){
    var op=document.getElementById(id+'-op'); if(!op)return;
    op.addEventListener('change',function(){document.getElementById(id+'-b').hidden=op.value!=='bt';});
  });
}
function resetFilter(){
  document.getElementById('filters').innerHTML=filtersHtml(); bindBetween(); applyFilter();
}
function muatTabelVideo(){
  bindBetween();
  allVideos = (rep && rep.videos) ? rep.videos : [];
  applyFilter();
}
function readNum(id){
  var op=document.getElementById(id+'-op').value;
  var a=parseFloat(document.getElementById(id+'-a').value);
  var b=parseFloat(document.getElementById(id+'-b').value);
  return {op:op,a:isNaN(a)?null:a,b:isNaN(b)?null:b};
}
function readDate(id){
  var op=document.getElementById(id+'-op').value;
  var a=document.getElementById(id+'-a').value||null;
  var b=document.getElementById(id+'-b').value||null;
  return {op:op,a:a,b:b};
}
function lolosNum(val,f){
  if(!f.op)return true;
  if(f.op==='gt')return f.a==null?true:val>f.a;
  if(f.op==='lt')return f.a==null?true:val<f.a;
  if(f.op==='bt'){var lo=f.a,hi=f.b;if(lo!=null&&val<lo)return false;if(hi!=null&&val>hi)return false;return true;}
  return true;
}
function lolosDate(val,f){
  if(!f.op||!val)return !f.op?true:false;
  if(f.op==='gt')return f.a?val>f.a:true;
  if(f.op==='lt')return f.a?val<f.a:true;
  if(f.op==='bt'){if(f.a&&val<f.a)return false;if(f.b&&val>f.b)return false;return true;}
  return true;
}
var filteredVideos=[];
var vidPage=1;
var PER_PAGE=20;

function applyFilter(){ vidPage=1; renderVideoTable(); }

function renderVideoTable(){
  var box=document.getElementById('videotable');
  var user=(document.getElementById('f-user')?document.getElementById('f-user').value:'').toLowerCase().trim();
  var fRoi=readNum('f-roi'),fSpend=readNum('f-spend'),fGmv=readNum('f-gmv'),fPost=readDate('f-post');
  filteredVideos=allVideos.filter(function(v){
    if(user && v.username.toLowerCase().indexOf(user)<0)return false;
    if(!lolosNum(v.roi,fRoi))return false;
    if(!lolosNum(v.spend,fSpend))return false;
    if(!lolosNum(v.gmv,fGmv))return false;
    if(!lolosDate(v.tgl_posting,fPost))return false;
    return true;
  });

  var total=filteredVideos.length;
  var pages=Math.max(1,Math.ceil(total/PER_PAGE));
  if(vidPage>pages)vidPage=pages;
  document.getElementById('filter-count').textContent=total+' dari '+allVideos.length+' video';

  if(!total){box.innerHTML='<div class="panel-state">Tidak ada video yang cocok dengan filter.</div>';return;}

  var start=(vidPage-1)*PER_PAGE;
  var slice=filteredVideos.slice(start,start+PER_PAGE);
  var rows=slice.map(function(v,i){
    var url='https://www.tiktok.com/@'+encodeURIComponent(v.username)+'/video/'+encodeURIComponent(v.video_id);
    return '<tr><td>'+(start+i+1)+'</td>'+
      '<td><button class="namebtn" type="button" data-user="'+esc(v.username)+'">'+esc(v.username)+'</button></td>'+
      '<td>'+esc(String(v.video_id).slice(-10))+'</td>'+
      '<td>'+esc(tglPendek(v.tgl_posting))+'</td>'+
      '<td class="num">'+esc(rupiah(v.gmv))+'</td>'+
      '<td class="num">'+esc(rupiah(v.spend))+'</td>'+
      '<td class="num">'+esc(angka(v.order))+'</td>'+
      '<td class="num"><span class="badge '+kelasRoi(v.roi)+'">'+esc(roi(v.roi))+'</span></td>'+
      '<td class="num">'+esc(persen(v.ctr))+'</td>'+
      '<td><a class="linkout" href="'+url+'" target="_blank" rel="noopener">Buka</a></td></tr>';
  }).join('');
  box.innerHTML='<div class="scroll"><table><thead><tr><th>#</th><th>Kreator</th><th>ID video</th><th>Posting</th>'+
    '<th class="num">GMV</th><th class="num">Spend</th><th class="num">Order</th><th class="num">ROI</th><th class="num">CTR</th><th>Tautan</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>'+pagerHtml(vidPage,pages);
  pasangKlikNama(box);
  var pager=box.querySelector('.pager');
  if(pager) pager.querySelectorAll('button[data-page]').forEach(function(b){
    b.addEventListener('click',function(){ vidPage=parseInt(b.getAttribute('data-page'),10); renderVideoTable(); box.scrollIntoView({block:'start'}); });
  });
}

// Deret nomor halaman ringkas: 1 … (di sekitar aktif) … N
function pageList(cur,pages){
  var out=[], win=1;
  var set={};
  [1,2,pages-1,pages,cur-win,cur,cur+win].forEach(function(p){ if(p>=1&&p<=pages)set[p]=true; });
  var nums=Object.keys(set).map(Number).sort(function(a,b){return a-b;});
  var prev=0;
  nums.forEach(function(p){ if(p-prev>1)out.push('gap'); out.push(p); prev=p; });
  return out;
}
function pagerHtml(cur,pages){
  if(pages<=1)return '';
  var parts=['<div class="pager">'];
  parts.push('<button type="button" data-page="'+(cur-1)+'"'+(cur<=1?' disabled':'')+'>Sebelumnya</button>');
  pageList(cur,pages).forEach(function(p){
    if(p==='gap'){ parts.push('<span class="gap">…</span>'); return; }
    parts.push('<button type="button" data-page="'+p+'"'+(p===cur?' aria-current="true"':'')+'>'+p+'</button>');
  });
  parts.push('<button type="button" data-page="'+(cur+1)+'"'+(cur>=pages?' disabled':'')+'>Berikutnya</button>');
  parts.push('</div>');
  return parts.join('');
}

function pasangKlikNama(root){root.querySelectorAll('.namebtn').forEach(function(b){b.addEventListener('click',function(){bukaKreator(b.getAttribute('data-user'),b);});});}

/* ---------- drawer ---------- */
function bukaKreator(username,trigger){
  lastFocus=trigger||document.activeElement;
  var d=document.getElementById('drawer');
  document.getElementById('drawer-title').textContent='@'+username;
  document.getElementById('drawer-sub').textContent=tanggal(rep.range.start)+' sampai '+tanggal(rep.range.end);
  document.getElementById('drawer-body').innerHTML='<div class="panel-state"><div class="spin"></div>Mengambil video kreator.</div>';
  d.setAttribute('data-open','true');d.setAttribute('aria-hidden','false');
  document.getElementById('overlay').setAttribute('data-open','true');
  document.getElementById('drawer-close').focus();
  var r=rentang();
  fetch(GAS_URL+'?action=videos&start='+encodeURIComponent(r.s)+'&end='+encodeURIComponent(r.e)+'&username='+encodeURIComponent(username))
    .then(function(x){if(!x.ok)throw new Error('Server '+x.status);return x.json();})
    .then(function(j){if(!j.ok)throw new Error(j.error||'Respons tidak dikenali');renderDrawer(j.data||[]);})
    .catch(function(e){document.getElementById('drawer-body').innerHTML='<div class="panel-state">Detail gagal diambil. '+esc(e.message)+'.</div>';});
}
function renderDrawer(videos){
  if(!videos.length){document.getElementById('drawer-body').innerHTML='<div class="panel-state">Kreator ini tidak punya video pada rentang terpilih.</div>';return;}
  var sum=function(f){return videos.reduce(function(s,v){return s+(Number(v[f])||0);},0);};
  var gmv=sum('gmv'),spend=sum('spend'),order=sum('order');
  var rows=videos.map(function(v,i){
    var url='https://www.tiktok.com/@'+encodeURIComponent(v.username)+'/video/'+encodeURIComponent(v.video_id);
    return '<tr><td>'+(i+1)+'</td><td>'+esc(tglPendek(v.tgl_posting))+'</td>'+
      '<td class="num">'+esc(rupiah(v.gmv))+'</td><td class="num">'+esc(rupiah(v.spend))+'</td><td class="num">'+esc(angka(v.order))+'</td>'+
      '<td class="num"><span class="badge '+kelasRoi(v.roi)+'">'+esc(roi(v.roi))+'</span></td>'+
      '<td class="num">'+esc(persen(v.ctr))+'</td><td class="num">'+esc(persen(v.ctor))+'</td>'+
      '<td><a class="linkout" href="'+url+'" target="_blank" rel="noopener">Buka</a></td></tr>';
  }).join('');
  document.getElementById('drawer-body').innerHTML=
    '<dl class="dstats">'+
      dstat('Video',angka(videos.length))+dstat('GMV',rupiah(gmv))+
      dstat('Spend (PPN)',rupiah(spend))+dstat('Order',angka(order))+
      dstat('ROI',spend>0?roi(gmv/spend):'Tanpa spend')+dstat('Rasio biaya',gmv>0?rasio(spend/gmv):'—')+
    '</dl><h3>Semua video ('+videos.length+')</h3>'+
    '<div class="scroll"><table><thead><tr><th>#</th><th>Posting</th><th class="num">GMV</th><th class="num">Spend</th>'+
    '<th class="num">Order</th><th class="num">ROI</th><th class="num">CTR</th><th class="num">CTOR</th><th>Tautan</th></tr></thead>'+
    '<tbody>'+rows+'</tbody></table></div>';
}
function dstat(l,v){return '<div class="dstat"><dt>'+esc(l)+'</dt><dd>'+esc(v)+'</dd></div>';}
function tutupDrawer(){
  var d=document.getElementById('drawer');
  if(d.getAttribute('data-open')!=='true')return;
  d.setAttribute('data-open','false');d.setAttribute('aria-hidden','true');
  document.getElementById('overlay').setAttribute('data-open','false');
  if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus();
}

/* ---------- pasang ---------- */
document.getElementById('overlay').addEventListener('click',tutupDrawer);
document.getElementById('drawer-close').addEventListener('click',tutupDrawer);

init();
